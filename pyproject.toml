[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[project]
name = "golden-retriever"
version = "0.1.0"
description = "Golden Retriever - CLI and developer toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{name = "Yuichi Ito", email = "yuichi@yuichi.com"}]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.urls]
Repository = "https://github.com/yuichi110/golden_retriever"

[project.scripts]
gr = "gr.cli:main"

[tool.uv.build-backend]
module-name = "gr"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "tomlkit>=0.14.0",
    "ty>=0.0.35",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
preview = false
fix = true
unsafe-fixes = false
line-length = 120

[tool.ruff.lint]
select = [
    "C90", # mccabe 
    "F",   # Pyflakes
    "D",   # pydocstyle
    "E",   # Pycodestyle Error
    "I",   # isort
    "N",   # pep8-naming (N)
    "W",   # Pycodestyle Warning
    "ANN", # flake8-annotations (ANN)
    "CPY", # flake8-copyright
    "S",   # flake8-bandit
    "PL"   # Pylint
]

ignore = [
    "D203",    # 1 blank line required before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D415",    # First line should end with a period, question mark, or exclamation point
    "F401",    # imported but unused
    "PLC0414", # Import alias does not rename original package
    "PLC1901", # compare-to-empty-string
    "PLR0904", # Too many public methods
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0914", # Too many local variables
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "PLW2901"  # Outer variable overwritten by inner target
]

[tool.ruff.lint.per-file-ignores]
"tools/**.py" = [
    "ANN",     # flake8-annotations
    "S101",    # Use of assert detected
    "S310",    # Audit URL open for permitted schemes
    "S404",    # Subprocess module usage
    "S603",    # Subprocess call without shell=True
    "S607",    # Subprocess with partial executable path
    "PLC2701", # Private name import from external module
    "PLR6301", # Method could be a function/static method
]
"tests/**.py" = [
    "F403", # undefined-local-with-import-star
    "F405", # undefined-local-with-import-star-usage
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D103", # undocumented-public-function
    "D104", # undocumented-public-package
    "D107", # undocumented-public-init
    "ANN",  # flake8-annotations
    "CPY",  # flake8-copyright
    "S101", # Use of assert detected
    "PLC2701", # Private name import from external module (standard for unit tests)
    "PLR6301" # Method could be a function/static method (standard for pytest classes)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
